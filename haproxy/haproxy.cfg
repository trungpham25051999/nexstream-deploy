global
    log stdout format raw local0
    maxconn 2048
    ssl-default-bind-options ssl-min-ver TLSv1.3 ssl-max-ver TLSv1.3

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 2s
    timeout client 12s
    timeout server 12s
    timeout client-fin 2s
    timeout server-fin 2s

frontend nexstream_tls
    bind :9443 ssl crt /run/secrets/nexstream_server.pem ssl-min-ver TLSv1.3 ssl-max-ver TLSv1.3
    maxconn 1024
    default_backend nexstream_gateway

backend nexstream_gateway
    server gateway nexstream-ingest:9000 check inter 2s fall 2 rise 2 init-addr last,libc,none
